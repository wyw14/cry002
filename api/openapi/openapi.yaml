openapi: 3.0.3
info: {title: Archive Lifecycle API, version: 1.0.0}
servers: [{url: http://localhost:8080/api/v1}]
paths:
  /auth/login:
    post:
      summary: 登录并签发访问与刷新令牌
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
      responses: {'200': {description: Authenticated}, '401': {$ref: '#/components/responses/Error'}}
  /cases:
    get:
      security: [{bearerAuth: []}]
      summary: 组合检索案卷
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: classification_id, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses: {'200': {description: Paginated case files}, '400': {$ref: '#/components/responses/Error'}}
    post: {security: [{bearerAuth: []}], summary: 新建案卷及材料目录, responses: {'201': {description: Created}, '400': {$ref: '#/components/responses/Error'}}}
  /cases/{caseID}/submit:
    post: {security: [{bearerAuth: []}], summary: 提交案卷审核, parameters: [{$ref: '#/components/parameters/CaseID'}], responses: {'204': {description: Submitted}, '422': {$ref: '#/components/responses/Error'}}}
  /cases/{caseID}/review:
    post: {security: [{bearerAuth: []}], summary: 审核通过或退回, parameters: [{$ref: '#/components/parameters/CaseID'}], responses: {'204': {description: Reviewed}, '403': {$ref: '#/components/responses/Error'}}}
  /cases/{caseID}/archived-metadata:
    patch: {security: [{bearerAuth: []}], summary: 以新版本修改已归档元数据, parameters: [{$ref: '#/components/parameters/CaseID'}], responses: {'204': {description: Version created}, '422': {$ref: '#/components/responses/Error'}}}
  /cases/{caseID}/attachments:
    post: {security: [{bearerAuth: []}], summary: 上传受控附件, parameters: [{$ref: '#/components/parameters/CaseID'}], responses: {'201': {description: Uploaded}, '400': {$ref: '#/components/responses/Error'}}}
  /borrows:
    get: {security: [{bearerAuth: []}], summary: 查询借阅申请, responses: {'200': {description: Borrow list}}}
    post: {security: [{bearerAuth: []}], summary: 发起借阅申请, responses: {'201': {description: Applied}, '409': {$ref: '#/components/responses/Error'}}}
  /borrows/{borrowID}/checkout:
    post: {security: [{bearerAuth: []}], summary: 原子借出案卷, parameters: [{name: borrowID, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Checked out}, '409': {$ref: '#/components/responses/Error'}}}
  /classifications/{classID}/move:
    patch: {security: [{bearerAuth: []}], summary: 原子移动分类并防止循环, parameters: [{name: classID, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Moved}, '400': {$ref: '#/components/responses/Error'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters: {CaseID: {name: caseID, in: path, required: true, schema: {type: string}}}
  schemas:
    Login: {type: object, required: [email,password], properties: {email: {type: string, format: email}, password: {type: string, format: password}}}
    ErrorResponse: {type: object, properties: {error: {type: object, required: [code,message,request_id], properties: {code: {type: string}, message: {type: string}, fields: {type: object, additionalProperties: {type: string}}, request_id: {type: string}}}}}
  responses: {Error: {description: Stable application error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}}
